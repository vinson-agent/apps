<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#160a2e">
<title>Warung Rusuh: party arcade pasar malam</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23160a2e'/%3E%3Ccircle cx='8' cy='9' r='5' fill='%23ffc21a'/%3E%3Crect x='7' y='2' width='3' height='3' fill='%235be36b'/%3E%3C/svg%3E">
<style>
:root{--bg:#160a2e;--panel:#2a1252;--panel2:#371a66;--ink:#fff7e8;--muted:#c9b8f0;--y:#ffd23f;--r:#ff3b5c;--g:#22d66b;--b:#3a9bff;--pink:#ff5fc8;--line:#5a2f9a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
#top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:#0e0620;border-bottom:3px solid var(--y);min-height:44px}
#top a{color:var(--y);text-decoration:none;font-weight:800;white-space:nowrap;padding:4px 6px}
#ttl{flex:1;text-align:center;font-weight:900;letter-spacing:1px;color:var(--pink);text-shadow:2px 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#roomTag{font-weight:900;color:var(--y);font-size:14px;white-space:nowrap}
#mute{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:4px 9px;cursor:pointer;font-size:16px}
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;justify-content:center;align-items:flex-start;padding:14px 12px 24px}
#ov.hidden{display:none}
.scr{width:100%;max-width:540px;background:rgba(26,10,56,.9);border:3px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 0 #0a0418;margin:auto 0}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.95;margin:4px 0 6px;transform:rotate(-3deg)}
.logo span{font-family:"Arial Black",Impact,sans-serif;font-weight:900;font-size:clamp(34px,11vw,56px);color:var(--y);-webkit-text-stroke:2px #1a0630;text-shadow:4px 4px 0 var(--r),7px 7px 0 #1a0630}
.logo span+span{color:var(--pink);text-shadow:4px 4px 0 var(--b),7px 7px 0 #1a0630}
.sub{text-align:center;color:var(--muted);margin:8px 0 14px;font-size:14px}
h2{margin:4px 0 10px;font-size:22px;color:var(--y);text-shadow:2px 2px 0 #000}
h3{margin:14px 0 8px;font-size:16px;color:var(--pink)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--panel2);border:3px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;min-height:118px;box-shadow:0 4px 0 #0a0418;transition:transform .08s}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 #0a0418}
.card:hover{border-color:var(--y)}
.card b{font-size:15px;line-height:1.15}
.card small{color:var(--muted);font-size:12px;line-height:1.25}
.card em{font-style:normal;color:var(--y);font-size:12px;font-weight:700;margin-top:auto}
.card.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:10px}
.card.wide .tx{display:flex;flex-direction:column;gap:2px}
.card.mara{background:linear-gradient(135deg,#5a1a6e,#8a1d4f)}
.card.solo{background:linear-gradient(135deg,#123d5e,#1b5e48)}
.ic{width:44px;height:44px;image-rendering:pixelated;flex:0 0 auto}
.btn{display:block;width:100%;padding:13px 14px;margin:8px 0;border-radius:14px;border:3px solid #1a0630;background:var(--y);color:#1a0630;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 4px 0 #1a0630;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1a0630}
.btn.red{background:var(--r);color:#fff}.btn.green{background:var(--g)}.btn.blue{background:var(--b);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line);box-shadow:none;font-weight:700;font-size:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1 1 0;min-width:0;margin:6px 0;font-size:15px;padding:11px 8px}
label{display:block;font-weight:700;margin:8px 0 4px;color:var(--muted);font-size:14px}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:3px solid var(--line);background:#12072a;font-size:18px;font-weight:800;outline:none;-webkit-user-select:text;user-select:text}
input[type=text]:focus{border-color:var(--y)}
input.code{text-transform:uppercase;letter-spacing:8px;text-align:center;font-size:28px;font-family:"Arial Black",Impact,monospace}
.codebox{text-align:center;background:#12072a;border:3px dashed var(--y);border-radius:16px;padding:10px}
.codebox small{color:var(--muted);font-weight:700;letter-spacing:2px}
.codebox .code{display:block;font-family:"Arial Black",Impact,monospace;font-size:52px;letter-spacing:10px;color:var(--y);text-shadow:3px 3px 0 var(--r);line-height:1.1;-webkit-user-select:text;user-select:text}
.plist{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.plist li{display:flex;align-items:center;gap:7px;background:var(--panel2);border-radius:10px;padding:8px;font-weight:800;min-width:0;border-left:8px solid #888}
.plist li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.plist li .tg{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.plist li.empty{opacity:.35;border-left-color:#555;font-weight:600}
.plist li.me{background:#4b2a5e;box-shadow:inset 0 0 0 2px var(--y)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{padding:10px 6px;border-radius:12px;border:3px solid var(--line);background:var(--panel2);font-weight:800;cursor:pointer;font-size:14px}
.chip.on{background:var(--y);color:#1a0630;border-color:#1a0630}
.note{color:var(--muted);font-size:13px;line-height:1.4;margin:8px 0}
.tip{background:#12072a;border-left:5px solid var(--b);padding:8px 10px;border-radius:8px;color:var(--muted);font-size:13px;line-height:1.4;margin-top:12px}
.err{background:#3a0a1e;border-left:5px solid var(--r);padding:10px;border-radius:8px;font-weight:700;line-height:1.4}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 5px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:12px;font-weight:700}
td.n{text-align:right;font-weight:900;color:var(--y)}
td .dot,.plist .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid #1a0630}
.me{background:rgba(255,210,63,.12)}
.ok{color:var(--g);font-weight:900}.no{color:var(--r);font-weight:900}
.stamp{font-family:"Arial Black",Impact,sans-serif;font-size:44px;text-align:center;transform:rotate(-4deg);margin:2px 0 8px;-webkit-text-stroke:2px #1a0630;text-shadow:4px 4px 0 #1a0630}
.stamp.pass{color:var(--g)}.stamp.fail{color:var(--r)}
.spin{width:46px;height:46px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--y);animation:sp 0.8s linear infinite;margin:14px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.hs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:12px;color:var(--muted)}
.hs span{background:#12072a;border-radius:8px;padding:4px 8px}
#pad{flex:0 0 auto;display:none;gap:8px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:#0e0620;border-top:3px solid var(--y);height:30vh;height:30dvh;min-height:120px;max-height:240px;touch-action:none}
body.ingame #pad{display:flex}
.pb{flex:1;border-radius:20px;border:4px solid #1a0630;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Arial Black",Impact,sans-serif;font-size:28px;color:#fff;text-shadow:2px 2px 0 #1a0630;box-shadow:inset 0 -10px 0 rgba(0,0,0,.25),0 5px 0 #000;cursor:pointer;touch-action:none;transition:transform .05s,filter .05s;position:relative;overflow:hidden}
.pb small{font-family:"Segoe UI",system-ui,sans-serif;font-weight:900;font-size:13px;letter-spacing:1px;opacity:.95}
.pb.r{background:radial-gradient(circle at 40% 30%,#ff8a9c,#ff3b5c 45%,#b5102e)}
.pb.g{background:radial-gradient(circle at 40% 30%,#8cffb6,#22d66b 45%,#0f8a40)}
.pb.b{background:radial-gradient(circle at 40% 30%,#9cd0ff,#3a9bff 45%,#1655b5)}
.pb.dn,.pb.demo{transform:translateY(4px) scale(.97);filter:brightness(1.45)}
#pad.dim .pb{filter:grayscale(.75) brightness(.6)}
#toast{position:fixed;left:50%;bottom:34vh;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 16px;border-radius:20px;font-weight:800;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (min-width:760px){
 #pad{height:170px;max-width:760px;width:100%;margin:0 auto;border:3px solid var(--y);border-bottom:0;border-radius:18px 18px 0 0}
 .pb{font-size:34px}
}
@media (max-width:360px){.cards{grid-template-columns:1fr}.plist{grid-template-columns:1fr}}
</style>
</head>
<body>
<header id="top">
  <a href="../index.html" title="Kembali ke menu arcade">← Menu</a>
  <div id="ttl">WARUNG RUSUH</div>
  <span id="roomTag"></span>
  <button id="mute" type="button" aria-label="Suara">🔊</button>
</header>
<main id="stage">
  <canvas id="cv"></canvas>
  <div id="ov"></div>
</main>
<div id="pad">
  <div class="pb r" data-b="0"><span>A</span><small id="pl0">MERAH</small></div>
  <div class="pb g" data-b="1"><span>S</span><small id="pl1">HIJAU</small></div>
  <div class="pb b" data-b="2"><span>D</span><small id="pl2">BIRU</small></div>
</div>
<div id="toast"></div>

<!-- ===================== INTI: logika game + protokol room (tanpa DOM, bisa diuji di Node) ===================== -->
<script id="wr-core">
(function (root) {
'use strict';
const WR = {};
const A = 'ABCDEFGHJKMNPQRSTUVWXYZ'; // tanpa I, O, L (dan tanpa angka)
WR.VERSION = 1;
WR.ALPHABET = A;
WR.MAX_PLAYERS = 6;
WR.PEER_PREFIX = 'warungrusuh-';
WR.COLORS = ['#ff3b5c', '#ffd23f', '#22d66b', '#3a9bff', '#b46bff', '#ff8a2b'];
WR.COLOR_NAMES = ['Merah', 'Kuning', 'Hijau', 'Biru', 'Ungu', 'Jingga'];
WR.LEAD_MS = 6400;          // jeda dari "start" ke GO: intro + norma + READY
WR.MANGGA_TURN_MS = 10000;  // batas waktu satu giliran
WR.HB_MS = 2000;            // heartbeat
WR.DEAD_MS = 9000;          // dianggap putus kalau diam selama ini

WR.rng = function (seed) { // mulberry32
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
WR.shuffle = function (arr, r) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
WR.makeCode = function (r) { r = r || Math.random; let s = ''; for (let i = 0; i < 4; i++) s += A[Math.floor(r() * A.length)]; return s; };
WR.normCode = function (s) { return String(s || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); };
WR.validCode = function (s) { return typeof s === 'string' && s.length === 4 && [...s].every(c => A.includes(c)); };
WR.cleanName = function (s) { const n = String(s == null ? '' : s).replace(/[\u0000-\u001f<>&"'`]/g, '').replace(/\s+/g, ' ').trim().slice(0, 12); return n || 'Pemain'; };
WR.err = function (code, msg) { const e = new Error(msg || code); e.code = code; return e; };

WR.GAMES = {
  mangga: { id: 'mangga', title: 'Mangga atau Petasan', kind: 'turn', tag: 'Petik mangganya, jangan petasannya!',
    how: ['Penanda berputar keliling piring.', 'Tekan tombol APA SAJA untuk berhenti.', 'Mangga = +1 poin. Petasan = DUAR! (strike)', 'Bergiliran. 3 strike bersama = selesai.'],
    sub: 'Bergiliran · tekan pas di mangga' },
  sinyal: { id: 'sinyal', title: 'Sinyal Lemot', kind: 'race', duration: 6, tag: 'Fotonya harus terkirim SEKARANG!!',
    how: ['Sinyal lemot, foto nyangkut!', 'Pencet A / S / D secepat-cepatnya!', 'Berhenti sebentar = progres turun.', 'Tembus 100% sebelum waktu habis.'],
    sub: 'Balapan · pencet secepatnya' },
  pesanan: { id: 'pesanan', title: 'Pesanan Kilat', kind: 'race', duration: 40, tag: 'Pembeli antre, layani cepat!',
    how: ['Lihat pesanan di atas kasir.', 'MERAH = sate, HIJAU = kerupuk, BIRU = es teh.', 'Tekan sesuai jumlah. Kelebihan = HANGUS!', 'Pesanan makin banyak. Kejar poinnya!'],
    sub: 'Balapan · hitung & susun' },
};
WR.MARATHON = ['mangga', 'sinyal', 'pesanan'];
WR.SELECTIONS = ['mangga', 'sinyal', 'pesanan', 'maraton'];
WR.selTitle = function (s) { return s === 'maraton' ? 'Maraton (3 game)' : (WR.GAMES[s] ? WR.GAMES[s].title : s); };
WR.normaFor = function (id, round) {
  const k = 1 + 0.1 * (round || 0);
  if (id === 'mangga') return Math.min(22, Math.ceil(14 * k - 1e-9));
  if (id === 'sinyal') return Math.round(600 / k) / 100;
  return Math.ceil(15 * k - 1e-9);
};
WR.normaText = function (id, n) { return id === 'sinyal' ? '100% dalam ' + n.toFixed(2) + ' dtk' : n + ' poin'; };
WR.RANKS = [[0, 'Kerupuk'], [15, 'Gorengan'], [30, 'Sate'], [45, 'Bakso'], [60, 'Nasi Goreng'], [80, 'Raja Warung'], [100, 'Sultan Pasar Malam']];
WR.rankFor = function (total) { let r = WR.RANKS[0][1]; for (const [min, name] of WR.RANKS) if (total >= min) r = name; return r; };

// ---------- 7.2 Sinyal Lemot ----------
const SINYAL = {
  PER_PRESS: 2.5, DECAY: 12, IDLE: 0.2,
  create(o) { return { limit: (o && o.limit) || 6, t: 0, prog: 0, last: -9, presses: 0, done: false, finishT: null, over: false }; },
  update(s, t) {
    if (s.over) return;
    const dt = Math.max(0, t - s.t); s.t = Math.max(s.t, t);
    if (t - s.last > SINYAL.IDLE) s.prog = Math.max(0, s.prog - SINYAL.DECAY * dt);
    if (s.t >= s.limit) { s.t = s.limit; s.over = true; }
  },
  input(s, btn, t) {
    if (s.over || t < 0) return null;
    SINYAL.update(s, t); if (s.over) return null;
    s.prog = Math.min(100, s.prog + SINYAL.PER_PRESS); s.presses++; s.last = t;
    if (s.prog >= 100) { s.done = true; s.finishT = Math.round(t * 100) / 100; s.over = true; return { type: 'done' }; }
    return { type: 'tick', prog: s.prog };
  },
  report(s) { return { score: 0, prog: Math.round(s.prog * 10) / 10, finishT: s.finishT, over: s.over }; },
};
// ---------- 7.3 Pesanan Kilat ----------
const PESANAN = {
  order(seed, i) {
    const r = WR.rng((seed ^ Math.imul(i + 1, 0x9E3779B1)) >>> 0);
    const max = Math.min(5, 1 + Math.floor(i / 3));
    let c;
    do { c = [0, 1, 2].map(() => Math.floor(r() * (max + 1))); } while (c[0] + c[1] + c[2] === 0);
    return c;
  },
  points(order) { return 1 + Math.floor((order[0] + order[1] + order[2]) / 6); },
  create(o) { const s = { seed: o.seed >>> 0, limit: o.limit || 40, norma: o.norma, t: 0, idx: 0, order: null, stacks: [0, 0, 0], score: 0, served: 0, burnt: 0, over: false, ev: null }; s.order = PESANAN.order(s.seed, 0); return s; },
  next(s) { s.idx++; s.order = PESANAN.order(s.seed, s.idx); s.stacks = [0, 0, 0]; },
  update(s, t) { if (s.over) return; s.t = Math.max(s.t, t); if (s.t >= s.limit) { s.t = s.limit; s.over = true; } },
  input(s, btn, t) {
    if (s.over || t < 0 || !(btn >= 0 && btn <= 2)) return null;
    PESANAN.update(s, t); if (s.over) return null;
    s.stacks[btn]++;
    if (s.stacks[btn] > s.order[btn]) { s.burnt++; s.ev = { type: 'burn', t, btn, order: s.order.slice() }; PESANAN.next(s); return s.ev; }
    if (s.stacks[0] === s.order[0] && s.stacks[1] === s.order[1] && s.stacks[2] === s.order[2]) {
      const pts = PESANAN.points(s.order); s.score += pts; s.served++; s.ev = { type: 'ok', t, pts, order: s.order.slice() }; PESANAN.next(s); return s.ev;
    }
    return { type: 'add', btn };
  },
  report(s) { return { score: s.score, prog: s.served, finishT: null, over: s.over }; },
};
// ---------- 7.1 Mangga atau Petasan ----------
const MANGGA = {
  N: 12, SPEED0: 3.0, UP: 0.25, HARVESTS: 2, STRIKES: 3,
  newBoard(r) { const b = new Array(12).fill('M'); b[Math.floor(r() * 12)] = 'P'; return b; },
  create(seed, norma) { const r = WR.rng(seed >>> 0); return { r, board: MANGGA.newBoard(r), harvest: 1, speed: MANGGA.SPEED0, strikes: 0, team: 0, norma, per: {}, over: false, cleared: false }; },
  resolve(s, pid, plate) {
    const per = s.per[pid] || (s.per[pid] = { m: 0, p: 0 });
    let hit, refilled = false;
    if (s.over) return { hit: 'none', refilled };
    if (!(plate >= 0 && plate < 12)) { hit = 'timeout'; s.strikes++; per.p++; }
    else if (s.board[plate] === 'M') {
      hit = 'mango'; s.team++; per.m++; s.board[plate] = 'P'; s.speed = Math.round((s.speed + MANGGA.UP) * 1000) / 1000;
      if (!s.board.includes('M')) {
        if (s.harvest < MANGGA.HARVESTS) { s.harvest++; s.board = MANGGA.newBoard(s.r); refilled = true; }
        else { s.over = true; s.cleared = true; }
      }
    } else { hit = 'petasan'; s.strikes++; per.p++; }
    if (s.strikes >= MANGGA.STRIKES) s.over = true;
    return { hit, refilled };
  },
  posAt(phase0, speed, dt) { return (((phase0 + speed * Math.max(0, dt)) % 12) + 12) % 12; },
  points(s, pid, n) { const per = s.per[pid] || { m: 0, p: 0 }; return n <= 1 ? s.team : Math.max(0, s.team + per.m - 2 * per.p); },
};
WR.mods = { sinyal: SINYAL, pesanan: PESANAN, mangga: MANGGA };

WR.racePoints = function (id, r, norma) {
  if (id === 'sinyal') {
    const done = r.finishT != null;
    return { points: done ? 10 + Math.max(0, Math.round((6 - r.finishT) * 5)) : Math.floor(r.prog / 10),
      pass: done && r.finishT <= norma + 1e-9, detail: done ? r.finishT.toFixed(2) + ' dtk' : Math.floor(r.prog) + '%',
      sortKey: done ? r.finishT : 1000 - r.prog };
  }
  return { points: r.score, pass: r.score >= norma, detail: (r.prog || 0) + ' pesanan', sortKey: -r.score };
};
WR.isBonus = function (id, row, norma) {
  if (id === 'sinyal') return row.finishT != null && row.finishT <= norma / 1.5 + 1e-9;
  if (id === 'mangga') return row.team >= norma * 1.5;
  return row.points >= norma * 1.5;
};

function Emitter() { const h = {}; return { on(e, f) { (h[e] || (h[e] = [])).push(f); }, emit(e, ...a) { (h[e] || []).slice().forEach(f => { try { f(...a); } catch (err) { if (typeof console !== 'undefined') console.error(err); } }); } }; }
WR.Emitter = Emitter;

// ================= Transport tiruan in-memory (dipakai untuk Latihan Solo, link lokal host, dan uji) =================
// Host transport:   onConnect(f(id)) onMessage(f(id,msg)) onDisconnect(f(id)) send(id,msg) broadcast(msg) drop(id) close()
// Client transport: send(msg) onMessage(f(msg)) onClose(f(reason)) close()
class MemNet {
  constructor(timers, latency) { this.T = timers; this.lat = latency || 0; this.hosts = new Map(); this.seq = 0; }
  host(code) { const ex = this.hosts.get(code); if (ex && !ex.closed) throw WR.err('id-taken'); const h = new MemHost(this, code); this.hosts.set(code, h); return h; }
  connect(code) {
    return new Promise((res, rej) => {

function teardown() {
  clearTimeout(app.resTimer);
  if (app.client || app.host) app.leaving = true;
  if (app.client) { try { app.client.leave(); } catch (e) { /* */ } }
  if (app.host) { const H = app.host; setTimeout(() => { try { H.close('host-left'); } catch (e) { /* */ } }, 60); }
  app.client = null; app.host = null; app.mode = null; app.code = null;
  setTimeout(() => { app.leaving = false; }, 0);
}
function readName() { const el = $('#nm'); const n = WR.cleanName(el ? el.value : getName()); setName(n); return n; }
function makeClient(name) {
  const C = new WR.RoomClient({ timers, name });
  C.on('welcome', () => { if (app.client !== C) return; if (app.mode === 'solo') C.start(); });
  C.on('state', st => {
    if (app.client !== C) return;
    if (st.phase === 'lobby' && app.mode !== 'solo') { if (app.screen === 'lobby' || app.screen === 'busy' || app.screen === 'results' || app.screen === 'waiting') { if (app.screen === 'busy') Snd.play('join'); screenLobby(); } }
    else if (st.phase === 'game' && !(C.game && C.game.playing && !C.game.ended) && app.screen !== 'waiting') screenWaiting();
    else if (st.phase === 'results' && app.screen === 'busy') screenWaiting();
  });
  C.on('start', G => { if (app.client !== C) return; clearTimeout(app.resTimer); if (!G.playing) return screenWaiting(); enterGame(G); });
  C.on('turn', T => { if (app.client !== C) return; if (T.pid === C.me) Snd.play('turn'); });
  C.on('turnResult', m => { if (app.client !== C) return; onTurnResult(m); });
  C.on('results', m => {
    if (app.client !== C) return;
    recordHS(m);
    const delay = app.screen === 'game' ? 1100 : 0;
    clearTimeout(app.resTimer);
    app.resTimer = setTimeout(() => { if (app.client !== C) return; const mine = m.rows.find(r => r.id === C.me); const pass = m.game === 'mangga' ? m.teamPass : mine && mine.pass; Snd.play(pass ? 'pass' : 'fail'); screenResults(m); }, delay);
  });
  C.on('closed', reason => {
    if (app.client !== C) return;
    if (reason === 'left') return;
    app.client = null; screenError(reason, app.code);
  });
  return C;
}
function recordHS(m) {
  const C = app.client; const r = m.rows.find(x => x.id === C.me); if (!r) return;
  if (m.game === 'sinyal') { if (r.finishT != null && (!HS.sinyal || r.finishT < HS.sinyal)) HS.sinyal = r.finishT; }
  else if (!HS[m.game] || r.points > HS[m.game]) HS[m.game] = r.points;
  if (m.final && m.mara && m.mara.arcade) { const t = m.mara.totals.find(x => x.id === C.me); if (t && (!HS.maraton || t.total > HS.maraton)) { HS.maraton = t.total; HS.pangkat = t.rank; } }
  saveHS();
}
async function startSolo(sel) {
  teardown();
  const name = getName() || 'Kamu';
  const hub = new WR.MemNet(timers, 0); const loc = hub.host('SOLO');
  app.host = new WR.RoomHost(WR.muxHost({ loc }), { timers, solo: true, selection: sel });
  app.mode = 'solo'; app.code = null; roomTag();
  const ct = await hub.connect('SOLO');
  app.client = makeClient(name); app.client.attach(ct);
}
async function createRoom(sel) {
  const name = readName(); teardown(); app.mode = 'host';
  screenBusy('Membuat room…');
  const token = app.token = {};
  try {
    await loadPeer(); if (app.token !== token) return;
    let tr = null, code = null;
    for (let i = 0; i < 6 && !tr; i++) {
      code = WR.makeCode();
      try { tr = await PeerNet.host(code); } catch (e) { if (e.code !== 'id-taken') throw e; }
      if (app.token !== token) { if (tr) tr.close(); return; }
    }
    if (!tr) throw WR.err('id-taken');
    const hub = new WR.MemNet(timers, 0); const loc = hub.host('L');
    app.host = new WR.RoomHost(WR.muxHost({ loc, net: tr }), { timers, code, selection: sel });
    app.mode = 'host'; app.code = code; roomTag();
    const ct = await hub.connect('L');
    app.client = makeClient(name); app.client.attach(ct);
    history.replaceState(null, '', location.pathname);
  } catch (e) { if (app.token === token) screenError(e.code || 'unknown'); }
}
async function joinRoom(raw) {
  const code = WR.normCode(raw);
  if (!WR.validCode(code)) { toast('Kode harus 4 huruf (tanpa I, O, L)'); return; }
  const name = readName(); teardown(); app.mode = 'guest'; app.code = code;
  screenBusy('Menyambung ke room ' + code + '…');
  const token = app.token = {};
  try {
    await loadPeer(); if (app.token !== token) return;
    const ct = await PeerNet.join(code);
    if (app.token !== token) { ct.close(); return; }
    app.mode = 'guest'; app.code = code; roomTag();
    const C = makeClient(name); app.client = C; C.attach(ct);
    setTimeout(() => { if (app.client === C && !C.welcomed) { C._close('timeout'); } }, 8000);
  } catch (e) { if (app.token === token) screenError(e.code || 'unknown', code); }
}
function leaveRoom() { teardown(); history.replaceState(null, '', location.pathname); screenMenu(); }

const fx = { shake: 0, flash: 0, flashC: '#fff', parts: [], pops: [] };
function burst(x, y, colors, n, sp) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = (sp || 160) * (0.3 + Math.random()); fx.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 0.6 + Math.random() * 0.5, age: 0, c: colors[i % colors.length], s: 3 + Math.random() * 4 }); } }
function pop(text, x, y, color, size) { fx.pops.push({ text, x, y, c: color || '#ffd23f', size: size || 28, age: 0, life: 1 }); }
function stepFx(dt) {
  fx.shake = Math.max(0, fx.shake - dt * 30); fx.flash = Math.max(0, fx.flash - dt * 3);
  fx.parts = fx.parts.filter(p => (p.age += dt) < p.life); fx.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; });
  fx.pops = fx.pops.filter(p => (p.age += dt) < p.life);
}
function drawFx(c) {
  fx.parts.forEach(p => { c.globalAlpha = 1 - p.age / p.life; c.fillStyle = p.c; c.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }); c.globalAlpha = 1;
  fx.pops.forEach(p => { const k = p.age / p.life; c.globalAlpha = 1 - k * k; comic(c, p.text, p.x, p.y - k * 40, p.size * (1 + Math.max(0, 0.3 - k)), p.c, -0.08); }); c.globalAlpha = 1;
}
